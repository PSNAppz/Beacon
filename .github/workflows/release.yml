name: Release

# Tag pushes publish a release. Pushes to main only warm the Rust cache.
#
# Why the main trigger exists: GitHub Actions caches are scoped to the ref that
# created them, and a tag ref is a fresh scope every time. A cache saved during
# `v0.4.0` can never be read by `v0.5.0`. Only caches on the default branch are
# readable from every ref — so without a main build, every single release
# recompiled the whole AWS SDK tree from cold.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight warm build; never cancel a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # `key` keeps the two macOS targets in separate caches — they share a
      # runner label but not their build artifacts. `save-if` limits writes to
      # main, because a cache written on a tag is unreadable by the next tag.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.rust-targets }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # `generate_context!` reads ../dist at compile time, so the frontend must
      # exist before cargo runs — even when we are only warming the cache.
      - name: Build frontend
        run: npm run build

      # Compiles the exact same dependency graph the release build needs,
      # with the same feature flags, so the cached artifacts are reused rather
      # than rebuilt. Skipped on tags, where the release step does the work.
      - name: Warm dependency cache
        if: github.ref == 'refs/heads/main'
        working-directory: src-tauri
        run: cargo build --release --bins --features tauri/custom-protocol ${{ matrix.args }}

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still succeeds,
          # but `latest.json` carries no signature and clients reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Beacon ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download Beacon ${{ github.ref_name }} for your platform.
          # Must stay false: the updater endpoint resolves
          # /releases/latest/download/latest.json, which skips drafts.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
