[package]
name = "beacon"
version = "0.3.0"
description = "Beacon — remote log viewer"
authors = ["Beacon"]
edition = "2021"
rust-version = "1.91"

[lib]
name = "beacon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async
tokio = { version = "1", features = ["full"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
# OS credential store (macOS Keychain / Windows Credential Manager / Secret Service)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# ssh
russh = "0.45"
russh-keys = "0.45"

# AWS integrations (no CLI required)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ssm = "1"
aws-sdk-s3 = "1"
aws-sdk-ec2 = "1"
aws-sdk-autoscaling = "1"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures = "0.3"
sha2 = "0.10"

# util
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Self-update from GitHub releases. Desktop only — there is no updater on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
