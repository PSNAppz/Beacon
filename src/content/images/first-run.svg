<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180" font-family="Inter, system-ui, sans-serif">
  <rect width="700" height="180" rx="10" fill="#141416"/>
  <g>
    <rect x="24" y="40" width="140" height="100" rx="8" fill="#18181A" stroke="#2C2C30"/>
    <text x="38" y="66" fill="#EBEBED" font-size="11" font-weight="600">1 · Master</text>
    <text x="38" y="80" fill="#EBEBED" font-size="11" font-weight="600">password</text>
    <text x="38" y="102" fill="#8C8C92" font-size="9">Encrypts every</text>
    <text x="38" y="115" fill="#8C8C92" font-size="9">saved credential.</text>
  </g>
  <path d="M170 90 h20" stroke="#5A5A60" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="196" y="40" width="140" height="100" rx="8" fill="#18181A" stroke="#2C2C30"/>
    <text x="210" y="66" fill="#EBEBED" font-size="11" font-weight="600">2 · Add a</text>
    <text x="210" y="80" fill="#EBEBED" font-size="11" font-weight="600">session</text>
    <text x="210" y="102" fill="#8C8C92" font-size="9">Host, user, key or</text>
    <text x="210" y="115" fill="#8C8C92" font-size="9">password, or SSM.</text>
  </g>
  <path d="M342 90 h20" stroke="#5A5A60" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="368" y="40" width="140" height="100" rx="8" fill="#18181A" stroke="#2C2C30"/>
    <text x="382" y="66" fill="#EBEBED" font-size="11" font-weight="600">3 · Connect</text>
    <text x="382" y="88" fill="#8C8C92" font-size="9">Beacon lists the</text>
    <text x="382" y="101" fill="#8C8C92" font-size="9">Docker containers</text>
    <text x="382" y="114" fill="#8C8C92" font-size="9">on that host.</text>
  </g>
  <path d="M514 90 h20" stroke="#5A5A60" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="540" y="40" width="140" height="100" rx="8" fill="#18181A" stroke="#3A3A3E"/>
    <text x="554" y="66" fill="#EBEBED" font-size="11" font-weight="600">4 · Stream</text>
    <text x="554" y="88" fill="#8C8C92" font-size="9">Open a container</text>
    <text x="554" y="101" fill="#8C8C92" font-size="9">and watch its logs</text>
    <text x="554" y="114" fill="#8C8C92" font-size="9">live.</text>
  </g>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#5A5A60"/></marker></defs>
</svg>
