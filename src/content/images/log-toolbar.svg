<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="210" rx="10" fill="#141416"/>
  <rect x="20" y="28" width="720" height="34" rx="6" fill="#18181A" stroke="#2C2C30"/>

  <text x="34" y="50" fill="#EBEBED" font-size="12" font-weight="600">web-1</text>
  <rect x="86" y="38" width="76" height="16" rx="3" fill="#2C2C30"/>
  <text x="92" y="50" fill="#8C8C92" font-size="9" font-family="monospace">a1b2c3d4e5f6</text>
  <text x="172" y="50" fill="#8C8C92" font-size="10">Up 3 days</text>

  <rect x="430" y="36" width="150" height="20" rx="5" fill="#0A0A0B" stroke="#3A3A3E"/>
  <circle cx="442" cy="46" r="3.5" fill="none" stroke="#8C8C92" stroke-width="1.2"/>
  <line x1="444.5" y1="48.5" x2="447" y2="51" stroke="#8C8C92" stroke-width="1.2"/>
  <text x="454" y="50" fill="#8C8C92" font-size="9">filter (regex)</text>

  <rect x="592" y="36" width="22" height="20" rx="4" fill="#0A0A0B"/><text x="598" y="50" fill="#8C8C92" font-size="11">⏸</text>
  <rect x="618" y="36" width="22" height="20" rx="4" fill="#2A2A2E"/><text x="623" y="50" fill="#EBEBED" font-size="11">⌄⌄</text>
  <rect x="644" y="36" width="22" height="20" rx="4" fill="#0A0A0B"/><text x="650" y="50" fill="#8C8C92" font-size="11">⌫</text>
  <rect x="674" y="36" width="24" height="20" rx="4" fill="#0A0A0B"/><text x="680" y="50" fill="#8C8C92" font-size="13">···</text>

  <g stroke="#5A5A60" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="66" x2="120" y2="92"/>
    <line x1="505" y1="66" x2="505" y2="92"/>
    <line x1="629" y1="66" x2="629" y2="110"/>
    <line x1="686" y1="66" x2="686" y2="128"/>
  </g>

  <text x="34" y="106" fill="#EBEBED" font-size="10" font-weight="600">1 · Identity</text>
  <text x="34" y="120" fill="#8C8C92" font-size="9">Name, short ID, uptime. Truncates first.</text>

  <text x="380" y="106" fill="#EBEBED" font-size="10" font-weight="600">2 · Filter</text>
  <text x="380" y="120" fill="#8C8C92" font-size="9">Regex. Always visible.</text>

  <text x="470" y="142" fill="#EBEBED" font-size="10" font-weight="600">3 · Hot controls</text>
  <text x="470" y="156" fill="#8C8C92" font-size="9">Pause · Follow tail · Clear buffer</text>

  <text x="470" y="178" fill="#EBEBED" font-size="10" font-weight="600">4 · More (···)</text>
  <text x="470" y="192" fill="#8C8C92" font-size="9">Stats · Tail size · Presets · Rules · Archive · Export</text>

  <rect x="34" y="136" width="330" height="58" rx="6" fill="#18181A" stroke="#2C2C30"/>
  <text x="46" y="154" fill="#8C8C92" font-size="9">These four zones never wrap onto a second row,</text>
  <text x="46" y="168" fill="#8C8C92" font-size="9">so the toolbar can never steal height from the</text>
  <text x="46" y="182" fill="#8C8C92" font-size="9">log, however narrow the window gets.</text>
</svg>
